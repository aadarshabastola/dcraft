name: dcraft
description: "Decentralized Tusayan White Ware Classificaiton and Recording."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^13.0.1
  image_cropper: ^9.0.0
  image_picker: ^1.0.7
  intl: ^0.19.0
  page_transition: ^2.1.0
  provider: ^6.1.2
  image: ^3.3.0
  tflite_flutter: ^0.11.0
  google_maps_flutter: ^2.6.0
  carousel_slider: ^5.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  font_awesome_flutter: ^10.1.0
  google_sign_in: ^6.1.6
  googleapis: ^12.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  http: ^1.1.0
  path: ^1.8.3
  path_provider: ^2.1.5
  
dev_dependencies:
  flutter_test:
    sdk: flutter


flutter:
  assets:
    - assets/
    - images/
    - images/Kanaa/
    - images/Black_Mesa/
    - images/Sosi/
    - images/Dogoszhi/
    - images/Flagstaff/
    - images/Tusayan/
    - images/Kayenta/
  uses-material-design: true
  fonts: 
    - family: Uber
      fonts:
        - asset: fonts/UberMoveBold.otf
          weight: 700
        - asset: fonts/UberMoveMedium.otf
          weight: 500